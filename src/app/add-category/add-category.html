<div class="overlay">
  <div class="popup">
    <h2>Add Category</h2>

    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" [(ngModel)]="name" placeholder="Enter category name" />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="description" placeholder="Enter category description"></textarea>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="actions">
      <button (click)="submit()" [disabled]="isSubmitting">Submit</button>
      <button class="cancel" (click)="cancel($event)">Cancel</button>
    </div>
  </div>
</div>
